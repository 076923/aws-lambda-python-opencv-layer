name: Build layers

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  NUMPY_VERSION: "2.5.4"

jobs:
  # cv2 is built with the Python Limited API, so one build per
  # (OpenCV, profile, arch) serves every Python >= 3.12.
  opencv:
    strategy:
      fail-fast: false
      matrix:
        opencv: ["4.14.0", "5.1.0"]
        profile: [minimal, standard, dnn]
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh 3.12 ${{ matrix.arch }} opencv ${{ matrix.opencv }} ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-${{ matrix.opencv }}-${{ matrix.profile }}-${{ matrix.arch }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  numpy:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh ${{ matrix.python }} ${{ matrix.arch }} numpy ${{ env.NUMPY_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: numpy-${{ matrix.python }}-${{ matrix.arch }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  # Smoke-test and zip inside each target runtime.
  package:
    needs: [opencv, numpy]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: opencv-*-${{ matrix.arch }}
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: numpy-${{ matrix.python }}-${{ matrix.arch }}
          path: artifacts
      - run: ./build.sh ${{ matrix.python }} ${{ matrix.arch }} package
      - uses: actions/upload-artifact@v4
        with:
          name: layers-${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: layers-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS
          {
            echo "| File | Profile | Python | Arch | OpenCV | NumPy | Unzipped (MB) | Zipped (MB) |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -rs 'sort_by(.file)[] | "| \(.file) | \(.profile) | \(.python) | \(.arch) | \(.opencv) | \(.numpy) | \(.unzipped_mb) | \(.zipped_mb) |"' *.json
          } > ../notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: notes.md
